services:
  - type: web
    name: hh-goa-frame-api
    runtime: node
    region: singapore
    plan: free
    rootDir: Task_1
    buildCommand: npm ci
    startCommand: npm run start --workspace=@hh-goa/frame-server
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - Task_1/**
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: STORAGE_PROVIDER
        value: r2
      - key: SHARE_TTL_HOURS
        value: "24"
      - key: CLIENT_URL
        sync: false
      - key: PUBLIC_SERVER_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: R2_ENDPOINT
        sync: false
