[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goa-voice-rag"
version = "0.1.0"
description = "Voice-enabled multilingual RAG for Hacker House Goa 2026"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9.0", "pytest-asyncio>=0.23,<1.0", "ruff>=0.6,<1.0", "mypy>=1.11,<2.0"]
ml = [
  "datasets>=2.20,<4.0",
  "sentence-transformers>=3.0,<4.0",
  "numpy>=1.26,<3.0",
  "hnswlib>=0.8,<1.0",
  "bm25s>=0.2,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "ingestion*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP012", "UP017"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["tests"]
